## x86-64 PE executable with three functions, one of which has an
## exception handler.  Used to verify that BOLT skips functions with
## exception handlers and still processes the rest.
##
## .text layout (RVA 0x1000, 96 bytes):
##   func_a   @ 0x1000 .. 0x100F  (16 bytes) - no handler
##   func_b   @ 0x1010 .. 0x101C  (13 bytes) - HAS exception handler
##   func_c   @ 0x1050 .. 0x105F  (16 bytes) - no handler
##
## .rdata (RVA 0x2000, 20 bytes) UNWIND_INFO:
##   offset 0: func_a unwind  (01 00 00 00)  v1, no flags
##   offset 4: func_b unwind  (09 00 00 00 00 10 00 00 20 00 00 00)
##             v1, UNW_FLAG_EHANDLER, handler=0x1000, GS data=0x20
##   offset 16: func_c unwind (01 00 00 00)  v1, no flags
##
## .pdata (RVA 0x4000, 36 bytes) three RUNTIME_FUNCTION entries:
##   {0x1000, 0x1010, 0x2000}  func_a -> unwind at rdata+0
##   {0x1010, 0x101D, 0x2004}  func_b -> unwind at rdata+4
##   {0x1050, 0x1060, 0x2010}  func_c -> unwind at rdata+16

